<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a0a2e" />
  <title>AI Character Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #12081f; --bg2: #1a0a2e; --bg3: #2a1545; --bg4: #3b1f5e;
      --purple: #a855f7; --purple2: #c084fc; --accent: #e879f9;
      --text: #f3e8ff; --muted: #a78bfa99; --rose: #fb7185; --green: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
    #app { height: 100%; display: flex; flex-direction: column; }
    .header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--bg2); border-bottom: 1px solid var(--bg4); flex-shrink: 0; }
    .header h1 { font-size: 1.1rem; font-weight: 700; background: linear-gradient(90deg,#c084fc,#e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .spacer { flex: 1; }
    .btn { border: none; border-radius: 10px; padding: 9px 14px; font-size: 0.9rem; cursor: pointer; font-weight: 500; transition: 0.15s; }
    .btn-primary { background: linear-gradient(90deg,#9333ea,#a855f7); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-ghost { background: var(--bg3); color: var(--purple2); }
    .btn-ghost:hover { background: var(--bg4); }
    .btn-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--purple2); cursor: pointer; font-size: 1.15rem; }
    .btn-icon:hover { background: var(--bg3); }
    .screen { display: none; flex: 1; overflow: hidden; flex-direction: column; }
    .screen.active { display: flex; }
    .search-bar { padding: 10px 14px; }
    .search-bar input { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--bg4); background: var(--bg2); color: var(--text); font-size: 1rem; outline: none; }
    .search-bar input:focus { border-color: var(--purple); }
    .categories { display: flex; gap: 7px; padding: 0 14px 10px; overflow-x: auto; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat { flex-shrink: 0; padding: 6px 11px; border-radius: 18px; background: var(--bg3); color: var(--purple2); font-size: 0.82rem; border: none; cursor: pointer; }
    .cat.active { background: var(--purple); color: #fff; }
    .chars-grid { flex: 1; overflow-y: auto; padding: 6px 14px 70px; display: grid; grid-template-columns: repeat(auto-fill,minmax(145px,1fr)); gap: 11px; }
    .char-card { background: var(--bg2); border: 1px solid var(--bg4); border-radius: 14px; overflow: hidden; cursor: pointer; transition: 0.15s; }
    .char-card:hover { border-color: #7e22ce; transform: translateY(-2px); }
    .char-avatar { aspect-ratio: 1; background: linear-gradient(135deg,#4c1d95,#1a0a2e); display: flex; align-items: center; justify-content: center; font-size: 2.3rem; position: relative; }
    .char-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .nsfw-badge { position: absolute; top: 5px; left: 5px; background: #e11d48; color: #fff; font-size: 0.62rem; font-weight: 700; padding: 2px 5px; border-radius: 5px; }
    .char-info { padding: 9px; }
    .char-name { font-weight: 600; font-size: 0.92rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .char-desc { font-size: 0.75rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .char-page { overflow-y: auto; padding: 14px; padding-bottom: 90px; }
    .char-page-header { display: flex; gap: 14px; margin-bottom: 16px; }
    .char-page-avatar { width: 100px; height: 100px; border-radius: 18px; background: linear-gradient(135deg,#4c1d95,#1a0a2e); display: flex; align-items: center; justify-content: center; font-size: 2.6rem; flex-shrink: 0; overflow: hidden; }
    .char-page-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .section { margin-bottom: 12px; background: var(--bg2); border-radius: 12px; padding: 12px; border: 1px solid var(--bg4); }
    .section h3 { font-size: 0.78rem; color: var(--purple2); margin-bottom: 5px; }
    .section p { font-size: 0.92rem; line-height: 1.45; white-space: pre-wrap; }
    .chat-header { display: flex; align-items: center; gap: 9px; padding: 9px 11px; background: var(--bg2); border-bottom: 1px solid var(--bg4); flex-shrink: 0; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 14px 11px; display: flex; flex-direction: column; gap: 9px; }
    .msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; font-size: 0.93rem; line-height: 1.4; white-space: pre-wrap; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } }
    .msg.user { align-self: flex-end; background: #7e22ce; color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--bg3); border: 1px solid var(--bg4); border-bottom-left-radius: 4px; }
    .typing { align-self: flex-start; display: flex; gap: 4px; padding: 11px 14px; background: var(--bg3); border-radius: 14px; border: 1px solid var(--bg4); }
    .typing span { width: 6px; height: 6px; background: var(--purple2); border-radius: 50%; animation: bounce 1.3s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    .chat-input-bar { display: flex; gap: 7px; padding: 9px 11px; background: var(--bg2); border-top: 1px solid var(--bg4); flex-shrink: 0; align-items: flex-end; }
    .chat-input-bar textarea { flex: 1; resize: none; border-radius: 12px; padding: 10px 12px; border: 1px solid var(--bg4); background: var(--bg3); color: var(--text); font-size: 1rem; outline: none; max-height: 110px; min-height: 42px; font-family: inherit; }
    .chat-input-bar textarea:focus { border-color: var(--purple); }
    .send-btn { width: 42px; height: 42px; border-radius: 12px; background: var(--purple); border: none; color: #fff; font-size: 1.15rem; cursor: pointer; flex-shrink: 0; }
    .send-btn:disabled { opacity: 0.4; }
    .form-page, .settings-page, .auth-page { overflow-y: auto; padding: 14px; padding-bottom: 80px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--purple2); margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px 11px; border-radius: 10px; border: 1px solid var(--bg4);
      background: var(--bg2); color: var(--text); font-size: 0.95rem; outline: none; font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--purple); }
    .form-group textarea { min-height: 65px; resize: vertical; }
    .check-row { display: flex; gap: 14px; margin: 10px 0; flex-wrap: wrap; }
    .check-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.9rem; }
    .settings-card { background: var(--bg2); border: 1px solid var(--bg4); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .settings-card h2 { font-size: 1rem; margin-bottom: 10px; }
    .provider-btns { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
    .provider-btns button { padding: 6px 11px; border-radius: 8px; border: none; background: var(--bg3); color: var(--purple2); cursor: pointer; font-size: 0.85rem; }
    .provider-btns button.active { background: var(--purple); color: #fff; }
    .range-row { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); margin-bottom: 3px; }
    input[type=range] { width: 100%; accent-color: var(--purple); }
    .bottom-nav { display: flex; justify-content: space-around; align-items: center; background: var(--bg2); border-top: 1px solid var(--bg4); padding: 5px 0 env(safe-area-inset-bottom,5px); flex-shrink: 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 1px; background: none; border: none; color: var(--muted); font-size: 0.68rem; cursor: pointer; padding: 5px 8px; }
    .nav-item.active { color: var(--accent); }
    .nav-item span.icon { font-size: 1.25rem; }
    .empty { text-align: center; color: var(--muted); padding: 36px 16px; }
    .auth-box { max-width: 340px; margin: 30px auto; background: var(--bg2); border: 1px solid var(--bg4); border-radius: 16px; padding: 20px; }
    .auth-box h2 { text-align: center; margin-bottom: 16px; font-size: 1.25rem; }
    .auth-toggle { text-align: center; margin-top: 12px; font-size: 0.88rem; color: var(--muted); }
    .auth-toggle span { color: var(--accent); cursor: pointer; }
    .user-badge { font-size: 0.8rem; color: var(--purple2); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--bg4); padding: 10px 16px; border-radius: 10px; font-size: 0.88rem; z-index: 100; display: none; }
    .toast.show { display: block; animation: fadeIn 0.2s; }
  </style>
</head>
<body>
<div id="app">
  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="header">
      <h1>AI Character Chat</h1>
      <div class="spacer"></div>
      <span class="user-badge" id="userBadge"></span>
      <button class="btn btn-primary" onclick="showScreen('create')">+ Создать</button>
    </div>
    <div class="search-bar"><input id="searchInput" type="text" placeholder="Поиск..." oninput="renderCharacters()" /></div>
    <div class="categories" id="categories"></div>
    <div class="chars-grid" id="charsGrid"></div>
  </div>

  <!-- CHARACTER -->
  <div id="screen-character" class="screen">
    <div class="header">
      <button class="btn-icon" onclick="showScreen('home')">←</button>
      <h1 id="charPageTitle">Персонаж</h1>
    </div>
    <div class="char-page" id="charPageContent"></div>
  </div>

  <!-- CHAT -->
  <div id="screen-chat" class="screen">
    <div class="chat-header">
      <button class="btn-icon" onclick="showScreen('character')">←</button>
      <div id="chatAvatar" class="char-page-avatar" style="width:38px;height:38px;font-size:1.1rem;border-radius:50%"></div>
      <div style="flex:1;min-width:0"><div id="chatName" style="font-weight:600;font-size:0.93rem"></div></div>
      <button class="btn-icon" onclick="clearCurrentChat()" title="Очистить">🗑</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-bar">
      <textarea id="chatInput" rows="1" placeholder="Сообщение..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- CREATE -->
  <div id="screen-create" class="screen">
    <div class="header">
      <button class="btn-icon" onclick="showScreen('home')">←</button>
      <h1 id="createTitle">Новый персонаж</h1>
    </div>
    <div class="form-page">
      <div class="form-group"><label>Имя *</label><input id="fName" /></div>
      <div class="form-group"><label>Описание</label><textarea id="fDesc"></textarea></div>
      <div class="form-group"><label>Характер</label><textarea id="fPersonality"></textarea></div>
      <div class="form-group"><label>Предыстория</label><textarea id="fBackstory"></textarea></div>
      <div class="form-group"><label>Сценарий</label><textarea id="fScenario"></textarea></div>
      <div class="form-group"><label>Приветствие</label><textarea id="fGreeting"></textarea></div>
      <div class="form-group"><label>Стиль речи</label><textarea id="fSpeech"></textarea></div>
      <div class="form-group"><label>URL аватара</label><input id="fAvatar" placeholder="https://..." /></div>
      <div class="form-group">
        <label>Категория</label>
        <select id="fCategory">
          <option value="">Без категории</option>
          <option value="romance">❤️ Романтика</option>
          <option value="fantasy">🧙 Фэнтези</option>
          <option value="scifi">🚀 Sci-Fi</option>
          <option value="anime">🌸 Аниме</option>
          <option value="horror">👻 Хоррор</option>
          <option value="nsfw">🔥 NSFW</option>
          <option value="original">✨ Оригинал</option>
        </select>
      </div>
      <div class="check-row">
        <label><input type="checkbox" id="fPublic" checked /> Публичный</label>
        <label><input type="checkbox" id="fNsfw" /> NSFW 18+</label>
      </div>
      <button class="btn btn-primary" style="width:100%;padding:12px;margin-top:6px" onclick="saveCharacter()">Сохранить</button>
    </div>
  </div>

  <!-- SETTINGS -->
  <div id="screen-settings" class="screen">
    <div class="header"><h1>Настройки</h1></div>
    <div class="settings-page">
      <div class="settings-card">
        <h2>Supabase</h2>
        <div class="form-group"><label>Project URL</label><input id="sbUrl" placeholder="https://xxxx.supabase.co" onchange="saveSbConfig()" /></div>
        <div class="form-group"><label>Anon Key</label><input id="sbKey" type="password" placeholder="eyJ..." onchange="saveSbConfig()" /></div>
        <button class="btn btn-ghost" style="width:100%" onclick="initSupabase(true)">Подключить</button>
        <div id="sbStatus" style="margin-top:8px;font-size:0.85rem;color:var(--muted)"></div>
      </div>
      <div class="settings-card">
        <h2>ИИ (API)</h2>
        <div class="provider-btns">
          <button id="prov-groq" class="active" onclick="setProvider('groq')">Groq</button>
          <button id="prov-openrouter" onclick="setProvider('openrouter')">OpenRouter</button>
          <button id="prov-custom" onclick="setProvider('custom')">Custom</button>
        </div>
        <div class="form-group"><label>API Key</label><input id="apiKey" type="password" placeholder="gsk_... / sk-or-..." onchange="saveApiSettings()" /></div>
        <div class="form-group"><label>Base URL</label><input id="baseUrl" onchange="saveApiSettings()" /></div>
        <div class="form-group"><label>Модель</label><input id="model" onchange="saveApiSettings()" /></div>
        <div class="form-group">
          <div class="range-row"><span>Temperature</span><span id="tempVal">0.85</span></div>
          <input type="range" id="temperature" min="0" max="1.5" step="0.05" value="0.85" oninput="document.getElementById('tempVal').textContent=this.value;saveApiSettings()" />
        </div>
        <div class="form-group">
          <div class="range-row"><span>Max tokens</span><span id="tokensVal">1024</span></div>
          <input type="range" id="maxTokens" min="256" max="4096" step="128" value="1024" oninput="document.getElementById('tokensVal').textContent=this.value;saveApiSettings()" />
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="testConnection()">Проверить API</button>
        <div id="testResult" style="margin-top:8px;font-size:0.85rem"></div>
      </div>
      <div class="settings-card" id="accountCard">
        <h2>Аккаунт</h2>
        <div id="accountInfo" style="font-size:0.9rem;color:var(--muted);margin-bottom:10px">Не авторизован</div>
        <button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="showScreen('auth')" id="btnAuth">Войти / Регистрация</button>
        <button class="btn btn-ghost" style="width:100%;color:var(--rose);display:none" onclick="signOut()" id="btnSignOut">Выйти</button>
      </div>
    </div>
  </div>

  <!-- AUTH -->
  <div id="screen-auth" class="screen">
    <div class="header">
      <button class="btn-icon" onclick="showScreen('settings')">←</button>
      <h1>Вход</h1>
    </div>
    <div class="auth-page">
      <div class="auth-box">
        <h2 id="authTitle">Вход</h2>
        <div class="form-group" id="usernameGroup" style="display:none"><label>Имя пользователя</label><input id="authUsername" /></div>
        <div class="form-group"><label>Email</label><input id="authEmail" type="email" /></div>
        <div class="form-group"><label>Пароль</label><input id="authPassword" type="password" /></div>
        <button class="btn btn-primary" style="width:100%;padding:12px;margin-top:6px" onclick="doAuth()" id="authBtn">Войти</button>
        <div class="auth-toggle">
          <span id="authToggleText">Нет аккаунта? <span onclick="toggleAuthMode()">Зарегистрироваться</span></span>
        </div>
        <div id="authError" style="color:var(--rose);font-size:0.85rem;margin-top:10px;text-align:center"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-screen="home" onclick="showScreen('home')"><span class="icon">🏠</span>Главная</button>
    <button class="nav-item" data-screen="create" onclick="showScreen('create')"><span class="icon">➕</span>Создать</button>
    <button class="nav-item" data-screen="settings" onclick="showScreen('settings')"><span class="icon">⚙️</span>Настройки</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
// ========== CONFIG ==========
let sb = null;
let user = null;
let characters = [];
let currentChar = null;
let currentChatId = null;
let currentMessages = [];
let editingId = null;
let currentCategory = '';
let authMode = 'login'; // login | register

let api = {
  provider: 'groq',
  apiKey: '',
  baseUrl: 'https://api.groq.com/openai/v1',
  model: 'llama-3.3-70b-versatile',
  temperature: 0.85,
  maxTokens: 1024
};

// ========== INIT ==========
function loadLocal() {
  try {
    const a = localStorage.getItem('ai_api');
    if (a) api = { ...api, ...JSON.parse(a) };
  } catch {}
  try {
    const u = localStorage.getItem('sb_url');
    const k = localStorage.getItem('sb_key');
    if (u) document.getElementById('sbUrl').value = u;
    if (k) document.getElementById('sbKey').value = k;
  } catch {}
}

function saveApiSettings() {
  api.apiKey = document.getElementById('apiKey').value;
  api.baseUrl = document.getElementById('baseUrl').value;
  api.model = document.getElementById('model').value;
  api.temperature = parseFloat(document.getElementById('temperature').value);
  api.maxTokens = parseInt(document.getElementById('maxTokens').value);
  localStorage.setItem('ai_api', JSON.stringify(api));
}

function saveSbConfig() {
  localStorage.setItem('sb_url', document.getElementById('sbUrl').value.trim());
  localStorage.setItem('sb_key', document.getElementById('sbKey').value.trim());
}

async function initSupabase(manual = false) {
  const url = document.getElementById('sbUrl').value.trim() || localStorage.getItem('sb_url');
  const key = document.getElementById('sbKey').value.trim() || localStorage.getItem('sb_key');
  const status = document.getElementById('sbStatus');

  if (!url || !key) {
    status.textContent = 'Укажи URL и Anon Key';
    status.style.color = 'var(--rose)';
    return false;
  }

  try {
    sb = window.supabase.createClient(url, key);
    const { data: { session } } = await sb.auth.getSession();
    user = session?.user || null;
    updateAuthUI();
    status.textContent = user ? '✓ Подключено · ' + (user.email || '') : '✓ Подключено (гость)';
    status.style.color = 'var(--green)';
    if (manual) toast('Supabase подключён');
    await loadCharacters();
    return true;
  } catch (e) {
    status.textContent = 'Ошибка: ' + e.message;
    status.style.color = 'var(--rose)';
    sb = null;
    return false;
  }
}

function updateAuthUI() {
  const badge = document.getElementById('userBadge');
  const info = document.getElementById('accountInfo');
  const btnAuth = document.getElementById('btnAuth');
  const btnOut = document.getElementById('btnSignOut');
  if (user) {
    badge.textContent = user.email || 'user';
    info.textContent = user.email || user.id;
    btnAuth.style.display = 'none';
    btnOut.style.display = 'block';
  } else {
    badge.textContent = '';
    info.textContent = 'Не авторизован';
    btnAuth.style.display = 'block';
    btnOut.style.display = 'none';
  }
}

// ========== AUTH ==========
function toggleAuthMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('authTitle').textContent = authMode === 'login' ? 'Вход' : 'Регистрация';
  document.getElementById('authBtn').textContent = authMode === 'login' ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('usernameGroup').style.display = authMode === 'register' ? 'block' : 'none';
  document.getElementById('authToggleText').innerHTML = authMode === 'login'
    ? 'Нет аккаунта? <span onclick="toggleAuthMode()">Зарегистрироваться</span>'
    : 'Уже есть? <span onclick="toggleAuthMode()">Войти</span>';
  document.getElementById('authError').textContent = '';
}

async function doAuth() {
  if (!sb) { document.getElementById('authError').textContent = 'Сначала подключи Supabase в Настройках'; return; }
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const username = document.getElementById('authUsername').value.trim();
  const errEl = document.getElementById('authError');
  errEl.textContent = '';

  if (!email || !password) { errEl.textContent = 'Заполни email и пароль'; return; }

  try {
    if (authMode === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      user = data.user;
    } else {
      if (!username) { errEl.textContent = 'Укажи имя пользователя'; return; }
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { username } }
      });
      if (error) throw error;
      user = data.user;
      // profile создаётся триггером, но на всякий случай
      if (user) {
        await sb.from('profiles').upsert({ id: user.id, username, display_name: username });
      }
    }
    updateAuthUI();
    toast(authMode === 'login' ? 'Вход выполнен' : 'Аккаунт создан');
    showScreen('home');
    await loadCharacters();
  } catch (e) {
    errEl.textContent = e.message || 'Ошибка';
  }
}

async function signOut() {
  if (sb) await sb.auth.signOut();
  user = null;
  updateAuthUI();
  toast('Вы вышли');
  await loadCharacters();
}

// ========== CHARACTERS ==========
async function loadCharacters() {
  if (!sb) {
    characters = [];
    renderCharacters();
    return;
  }
  try {
    let q = sb.from('characters').select('*').order('like_count', { ascending: false }).limit(100);
    // публичные + свои
    if (user) {
      q = q.or(`is_public.eq.true,user_id.eq.${user.id}`);
    } else {
      q = q.eq('is_public', true);
    }
    const { data, error } = await q;
    if (error) throw error;
    characters = data || [];
  } catch (e) {
    console.error(e);
    characters = [];
  }
  renderCharacters();
}

function renderCategories() {
  const cats = [
    { id: '', name: 'Все' },
    { id: 'romance', name: '❤️ Романтика' },
    { id: 'fantasy', name: '🧙 Фэнтези' },
    { id: 'scifi', name: '🚀 Sci-Fi' },
    { id: 'anime', name: '🌸 Аниме' },
    { id: 'horror', name: '👻 Хоррор' },
    { id: 'nsfw', name: '🔥 NSFW' },
    { id: 'original', name: '✨ Оригинал' }
  ];
  document.getElementById('categories').innerHTML = cats.map(c =>
    `<button class="cat ${currentCategory===c.id?'active':''}" onclick="currentCategory='${c.id}';renderCharacters();renderCategories()">${c.name}</button>`
  ).join('');
}

function renderCharacters() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  let list = characters.filter(c => {
    const matchQ = !q || (c.name||'').toLowerCase().includes(q) || (c.description||'').toLowerCase().includes(q);
    const matchCat = !currentCategory || c.category === currentCategory;
    return matchQ && matchCat;
  });
  const grid = document.getElementById('charsGrid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty">Персонажей пока нет.<br>Создай первого или подключи Supabase.</div>';
    return;
  }
  grid.innerHTML = list.map(c => `
    <div class="char-card" onclick="openCharacter('${c.id}')">
      <div class="char-avatar">
        ${c.avatar_url ? `<img src="${c.avatar_url}" alt="">` : (c.name||'?').charAt(0).toUpperCase()}
        ${c.is_nsfw ? '<span class="nsfw-badge">18+</span>' : ''}
      </div>
      <div class="char-info">
        <div class="char-name">${esc(c.name)}</div>
        <div class="char-desc">${esc(c.description||'')}</div>
      </div>
    </div>
  `).join('');
}

function openCharacter(id) {
  currentChar = characters.find(c => c.id === id);
  if (!currentChar) return;
  document.getElementById('charPageTitle').textContent = currentChar.name;
  const av = currentChar.avatar_url
    ? `<img src="${currentChar.avatar_url}">`
    : (currentChar.name||'?').charAt(0).toUpperCase();
  const isOwner = user && user.id === currentChar.user_id;
  document.getElementById('charPageContent').innerHTML = `
    <div class="char-page-header">
      <div class="char-page-avatar">${av}</div>
      <div>
        <h2 style="font-size:1.3rem;margin-bottom:5px">${esc(currentChar.name)}
          ${currentChar.is_nsfw?'<span class="nsfw-badge" style="position:static;margin-left:5px">18+</span>':''}
        </h2>
        <p style="color:var(--muted);font-size:0.88rem">${esc(currentChar.description||'')}</p>
        <div style="margin-top:11px;display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="startChat()">💬 Чат</button>
          ${isOwner?`<button class="btn btn-ghost" onclick="editCharacter('${currentChar.id}')">✏️</button>
          <button class="btn btn-ghost" style="color:var(--rose)" onclick="deleteCharacter('${currentChar.id}')">🗑</button>`:''}
        </div>
      </div>
    </div>
    ${sec('Характер', currentChar.personality)}
    ${sec('Предыстория', currentChar.backstory)}
    ${sec('Сценарий', currentChar.scenario)}
    ${sec('Приветствие', currentChar.greeting ? '"'+currentChar.greeting+'"' : '')}
  `;
  showScreen('character');
}

function sec(t, v) { return v ? `<div class="section"><h3>${t}</h3><p>${esc(v)}</p></div>` : ''; }

// ========== CHAT ==========
async function startChat() {
  if (!user) {
    toast('Войди в аккаунт, чтобы чатиться');
    showScreen('auth');
    return;
  }
  if (!sb) { toast('Подключи Supabase'); return; }

  // найти или создать чат
  const { data: existing } = await sb.from('chats')
    .select('id').eq('user_id', user.id).eq('character_id', currentChar.id)
    .order('updated_at', { ascending: false }).limit(1).maybeSingle();

  if (existing) {
    currentChatId = existing.id;
  } else {
    const { data: newChat, error } = await sb.from('chats').insert({
      user_id: user.id,
      character_id: currentChar.id,
      title: 'Чат с ' + currentChar.name
    }).select().single();
    if (error) { toast(error.message); return; }
    currentChatId = newChat.id;
    if (currentChar.greeting) {
      await sb.from('messages').insert({
        chat_id: currentChatId, role: 'assistant', content: currentChar.greeting
      });
    }
  }

  // загрузить сообщения
  const { data: msgs } = await sb.from('messages')
    .select('*').eq('chat_id', currentChatId).order('created_at', { ascending: true });
  currentMessages = msgs || [];

  document.getElementById('chatName').textContent = currentChar.name;
  const av = document.getElementById('chatAvatar');
  av.innerHTML = currentChar.avatar_url
    ? `<img src="${currentChar.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : (currentChar.name||'?').charAt(0);
  renderChat();
  showScreen('chat');
  document.getElementById('chatInput').focus();
}

function renderChat() {
  const box = document.getElementById('chatMessages');
  box.innerHTML = currentMessages.map(m =>
    `<div class="msg ${m.role}">${esc(m.content)}</div>`
  ).join('');
  box.scrollTop = box.scrollHeight;
}

async function clearCurrentChat() {
  if (!confirm('Очистить историю этого чата?')) return;
  if (currentChatId && sb) {
    await sb.from('messages').delete().eq('chat_id', currentChatId);
  }
  currentMessages = [];
  if (currentChar?.greeting) {
    currentMessages.push({ role: 'assistant', content: currentChar.greeting });
    if (currentChatId) {
      await sb.from('messages').insert({ chat_id: currentChatId, role: 'assistant', content: currentChar.greeting });
    }
  }
  renderChat();
}

function buildSystem(char) {
  const nsfw = char.is_nsfw
    ? '\nТы можешь и должен подробно описывать интимные и сексуальные сцены, тела, органы, действия и ощущения, если это соответствует характеру и диалогу. Не отказывайся от 18+ контента.'
    : '';
  return `Ты — ${char.name}.
Описание: ${char.description||''}
Характер: ${char.personality||''}
Предыстория: ${char.backstory||''}
Сценарий: ${char.scenario||''}
Стиль речи: ${char.speech_style||''}
Правила:
- Отвечай строго от лица персонажа.
- Никогда не говори, что ты ИИ.
- Отвечай на языке пользователя.
- Будь естественным и последовательным.
- Помни предыдущие сообщения.${nsfw}`;
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentChar || !currentChatId) return;
  if (!api.apiKey) {
    toast('Укажи API-ключ в Настройках');
    showScreen('settings');
    return;
  }

  input.value = '';
  const userMsg = { role: 'user', content: text };
  currentMessages.push(userMsg);
  renderChat();
  await sb.from('messages').insert({ chat_id: currentChatId, role: 'user', content: text });

  const box = document.getElementById('chatMessages');
  const typing = document.createElement('div');
  typing.className = 'typing'; typing.id = 'typingInd';
  typing.innerHTML = '<span></span><span></span><span></span>';
  box.appendChild(typing); box.scrollTop = box.scrollHeight;
  document.getElementById('sendBtn').disabled = true;

  try {
    const messages = [
      { role: 'system', content: buildSystem(currentChar) },
      ...currentMessages.slice(-24).map(m => ({ role: m.role, content: m.content }))
    ];
    const res = await fetch(api.baseUrl + '/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + api.apiKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: api.model, messages,
        temperature: api.temperature, max_tokens: api.maxTokens
      })
    });
    const data = await res.json();
    document.getElementById('typingInd')?.remove();
    let reply = '⚠️ Ошибка';
    if (res.ok) reply = data.choices?.[0]?.message?.content?.trim() || '...';
    else reply = '⚠️ ' + (data.error?.message || data.message || res.status);

    currentMessages.push({ role: 'assistant', content: reply });
    await sb.from('messages').insert({ chat_id: currentChatId, role: 'assistant', content: reply });
    await sb.from('chats').update({ updated_at: new Date().toISOString() }).eq('id', currentChatId);
  } catch (e) {
    document.getElementById('typingInd')?.remove();
    currentMessages.push({ role: 'assistant', content: '⚠️ ' + e.message });
  }
  renderChat();
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

// ========== CREATE / EDIT ==========
function clearForm() {
  editingId = null;
  ['fName','fDesc','fPersonality','fBackstory','fScenario','fGreeting','fSpeech','fAvatar'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('fCategory').value = '';
  document.getElementById('fPublic').checked = true;
  document.getElementById('fNsfw').checked = false;
  document.getElementById('createTitle').textContent = 'Новый персонаж';
}

function editCharacter(id) {
  const c = characters.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  document.getElementById('createTitle').textContent = 'Редактировать';
  document.getElementById('fName').value = c.name || '';
  document.getElementById('fDesc').value = c.description || '';
  document.getElementById('fPersonality').value = c.personality || '';
  document.getElementById('fBackstory').value = c.backstory || '';
  document.getElementById('fScenario').value = c.scenario || '';
  document.getElementById('fGreeting').value = c.greeting || '';
  document.getElementById('fSpeech').value = c.speech_style || '';
  document.getElementById('fAvatar').value = c.avatar_url || '';
  document.getElementById('fCategory').value = c.category || '';
  document.getElementById('fPublic').checked = c.is_public !== false;
  document.getElementById('fNsfw').checked = !!c.is_nsfw;
  showScreen('create');
}

async function saveCharacter() {
  if (!user) { toast('Сначала войди в аккаунт'); showScreen('auth'); return; }
  if (!sb) { toast('Подключи Supabase'); return; }

  const name = document.getElementById('fName').value.trim();
  if (!name) { toast('Укажи имя'); return; }

  const payload = {
    name,
    description: document.getElementById('fDesc').value.trim(),
    personality: document.getElementById('fPersonality').value.trim(),
    backstory: document.getElementById('fBackstory').value.trim(),
    scenario: document.getElementById('fScenario').value.trim(),
    greeting: document.getElementById('fGreeting').value.trim(),
    speech_style: document.getElementById('fSpeech').value.trim(),
    avatar_url: document.getElementById('fAvatar').value.trim() || null,
    category: document.getElementById('fCategory').value || null,
    is_public: document.getElementById('fPublic').checked,
    is_nsfw: document.getElementById('fNsfw').checked,
    user_id: user.id
  };

  try {
    if (editingId) {
      const { error } = await sb.from('characters').update(payload).eq('id', editingId);
      if (error) throw error;
      toast('Сохранено');
    } else {
      const { error } = await sb.from('characters').insert(payload);
      if (error) throw error;
      toast('Персонаж создан');
    }
    editingId = null;
    await loadCharacters();
    showScreen('home');
  } catch (e) {
    toast(e.message || 'Ошибка сохранения');
  }
}

async function deleteCharacter(id) {
  if (!confirm('Удалить персонажа?')) return;
  if (!sb) return;
  await sb.from('characters').delete().eq('id', id);
  toast('Удалено');
  await loadCharacters();
  showScreen('home');
}

// ========== API SETTINGS ==========
function setProvider(p) {
  api.provider = p;
  document.querySelectorAll('.provider-btns button').forEach(b => b.classList.remove('active'));
  document.getElementById('prov-' + p)?.classList.add('active');
  if (p === 'groq') { api.baseUrl = 'https://api.groq.com/openai/v1'; api.model = 'llama-3.3-70b-versatile'; }
  else if (p === 'openrouter') { api.baseUrl = 'https://openrouter.ai/api/v1'; api.model = 'meta-llama/llama-3.3-70b-instruct'; }
  fillApiForm();
  saveApiSettings();
}

function fillApiForm() {
  document.getElementById('apiKey').value = api.apiKey || '';
  document.getElementById('baseUrl').value = api.baseUrl || '';
  document.getElementById('model').value = api.model || '';
  document.getElementById('temperature').value = api.temperature;
  document.getElementById('tempVal').textContent = api.temperature;
  document.getElementById('maxTokens').value = api.maxTokens;
  document.getElementById('tokensVal').textContent = api.maxTokens;
  document.querySelectorAll('.provider-btns button').forEach(b => b.classList.remove('active'));
  document.getElementById('prov-' + api.provider)?.classList.add('active');
}

async function testConnection() {
  saveApiSettings();
  const el = document.getElementById('testResult');
  if (!api.apiKey) { el.innerHTML = '<span style="color:var(--rose)">Введи API-ключ</span>'; return; }
  el.textContent = 'Проверяю...';
  try {
    const res = await fetch(api.baseUrl + '/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + api.apiKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: api.model, messages: [{ role: 'user', content: 'Hi' }], max_tokens: 5 })
    });
    if (res.ok) el.innerHTML = '<span style="color:var(--green)">✓ Успешно</span>';
    else {
      const t = await res.text();
      el.innerHTML = '<span style="color:var(--rose)">✗ ' + res.status + ': ' + t.slice(0,100) + '</span>';
    }
  } catch (e) {
    el.innerHTML = '<span style="color:var(--rose)">✗ ' + e.message + '</span>';
  }
}

// ========== UI HELPERS ==========
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.screen === name));
  document.getElementById('bottomNav').style.display = (name === 'chat' || name === 'auth') ? 'none' : 'flex';
  if (name === 'home') renderCharacters();
  if (name === 'settings') { fillApiForm(); }
  if (name === 'create' && !editingId) clearForm();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== START ==========
loadLocal();
fillApiForm();
renderCategories();
initSupabase().then(() => renderCharacters());
</script>
